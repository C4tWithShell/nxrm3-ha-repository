{{- if and .Values.secret.nexusAdminSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "nexus.name" . }}-adminsecret
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | quote }}
  labels:
  {{- include "nexus.labels" . | nindent 4 }}
    {{- if .Values.nexus.extraLabels }}
      {{- with .Values.nexus.extraLabels }}
        {{ toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
type: Opaque
stringData:
  nexus-admin-password: {{ .Values.secret.nexusAdminSecret.adminPassword }}
{{- end }}
