# Declare variables to be passed into your templates.
# Namespace to deploy into. Leave empty to use the release namespace
# (helm -n <ns> / --create-namespace). Set to override it.
namespaceOverride: ""

serviceAccount:
  enabled: false
  name: nexus-repository-deployment-sa #This service account in managed by Helm
  labels: {}
  annotations: {}

statefulset:
  additionalVolumes:
  additionalVolumeMounts:
  additionalContainers:
  # Do not mount the service account token unless a sidecar needs the API server.
  automountServiceAccountToken: false
  # Pod-level security context. fsGroup makes the mounted nexus-data volume
  # group-owned (gid 200) and group-writable by the nexus user, so no chown is
  # needed. OnRootMismatch only re-applies ownership when the volume root does
  # not already match, keeping pod startup fast on large volumes.
  podSecurityContext:
    fsGroup: 200
    fsGroupChangePolicy: "OnRootMismatch"
  # Container-level security context, applied to the nxrm-app container and the
  # log sidecars. Defaults the pod UID/GID to match the nexus3 image. Customize
  # or relax these as appropriate for your deployment environment.
  securityContext:
    runAsUser: 200
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  # # Add annotations to statefulset to enhance configurations
  annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  # hostAliases allows the modification of the hosts file inside a container
  hostAliases: []
  # - ip: "192.168.1.10"
  #   hostnames:
  #   - "example.com"
  #   - "www.example.com"

  # Uncomment and modify this to run a command after starting the nexus container.
  postStart:
    command: null   # '["/bin/sh", "-c", "ls"]'
  preStart:
    command: null

  # # Add init containers. e.g. to be used to give specific permissions for nexus-data.
  # # Add your own init containers as needed
  initContainers:
    # Pre-create the log directories/files for a new pod so the tail sidecars
    # don't crash-loop and backoff whilst waiting for nxrm-app to start, which
    # increases the total start up time. Volume ownership is handled by fsGroup
    # (see podSecurityContext), so no chown is needed and this can run non-root.
    - name: init-log-dirs
      image: busybox:1.33.1
      command: [/bin/sh]
      args:
        - -c
        - >-
          mkdir -p /nexus-data/etc/logback &&
          mkdir -p /nexus-data/log/tasks &&
          mkdir -p /nexus-data/log/audit &&
          touch -a /nexus-data/log/tasks/allTasks.log &&
          touch -a /nexus-data/log/audit/audit.log &&
          touch -a /nexus-data/log/request.log
      securityContext:
        runAsUser: 200
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
      resources:
        limits:
          cpu: "0.2"
          memory: "512Mi"
        requests:
          cpu: "0.1"
          memory: "256Mi"
  container:
    image:
      repository: sonatype/nexus3
      nexusTag: 3.92.3
    resources:
      # See help documentation, these are minimum system requirements
      requests:
        cpu: 8
        memory: "8Gi"
      limits:
        cpu: 16
        memory: "16Gi"
    containerPort: 8081
    pullPolicy: IfNotPresent
    terminationGracePeriod: 120
    env:
      nexusDBName: nexus
      nexusDBPort: 5432
      install4jAddVmParams: "-Xms2703m -Xmx2703m"
      jdbcUrlParams: null # Must start with a '?' e.g. "?foo=bar&baz=foo"
      zeroDowntimeEnabled: false
    additionalEnv:
      null
      # -- Uncomment these when using secret.existingDbSecret.enabled = true
      # - name: DB_NAME
      #   valueFrom:
      #     secretKeyRef:
      #       name: secret-name
      #       key: secret-key
      # - name: DB_HOST
      #   valueFrom:
      #     secretKeyRef:
      #       name: secret-name
      #       key: secret-key
      # - name: DB_USER
      #   valueFrom:
      #     secretKeyRef:
      #       name: secret-name
      #       key: secret-key
      # - name: DB_PASSWORD
      #   valueFrom:
      #     secretKeyRef:
    #       name: secret-name
    #       key: secret-key
  requestLogContainer:
    image:
      repository: busybox
      tag: 1.33.1
    resources:
      limits:
        cpu: "0.2"
        memory: "512Mi"
      requests:
        cpu: "0.1"
        memory: "256Mi"
  auditLogContainer:
    image:
      repository: busybox
      tag: 1.33.1
    resources:
      limits:
        cpu: "0.2"
        memory: "512Mi"
      requests:
        cpu: "0.1"
        memory: "256Mi"
  taskLogContainer:
    image:
      repository: busybox
      tag: 1.33.1
    resources:
      limits:
        cpu: "0.2"
        memory: "512Mi"
      requests:
        cpu: "0.1"
        memory: "256Mi"
  startupProbe: # Allow up to 30 minutes for the container to finish any pending DB migration. Once the startup probe succeeds the liveness- and readiness probes get activated (no need for initialDelaySeconds).
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 180
    path: /
  livenessProbe:
    initialDelaySeconds: 0
    periodSeconds: 60
    timeoutSeconds: 1
    failureThreshold: 6
    path: /
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 60
    timeoutSeconds: 1
    failureThreshold: 6
    path: /
  imagePullSecrets:
    # -- The base64 encoded dockerconfigjson
    secret: ""
    # -- Use an existing imagePullSecret created by a secrets operator
    existingSecret:
      # -- By default the existing secret is disabled, set this to true in order to provide an existing imagePullSecret
      enabled: false
      # -- The existing imagePullSecret name
      name: ""

ingress:
  name: "nexus-ingress"
  enabled: false
  host: null #host to apply this ingress rule to e.g. example.com. Set it as you wish
  hostPath: /
  dockersubdomain: false # uncomment this if you'd like to create a wildcard rule in your ingress for docker sub domain routing. This will result in the creation of routing rules in your load balancer for sub domains of your host. Thus, you must also set the host
  defaultRule: false
  additionalRules: null
  ingressClassName: null # e.g. nginx, alb
  #  tls:
  #    - secretName: "tlsSecretName1"
  #      hosts:
  #      - repo.foo1
  #      - repo.bar1
  #    - secretName: "tlsSecretName2"
  #      hosts:
  #        - repo.foo2
  #        - repo.bar2
  annotations:
#    nginx.ingress.kubernetes.io/ssl-redirect: "false"
#    external-dns.alpha.kubernetes.io/hostname: dockerrepo1.example.com, dockerrepo2.example.com, dockerrepo3.example.com
logStorage:
  tailSecondaryLogs: true
  combineTaskLogs: true
ephemeralStorage:
  logs:
    enabled: false      # Set to true to store logs on ephemeral (emptyDir) storage instead of the PVC
    sizeLimit: "10Gi"   # Max size for the ephemeral log volume
    path: "/nexus-data/log"  # Mount path — must not be /nexus-data
  supportContent:
    enabled: false      # Set to true to store support content on ephemeral (emptyDir) storage instead of the PVC
    sizeLimit: "50Gi"   # Max size for the ephemeral support content volume
    path: "/nexus-data/tmp"  # Mount path — must not be /nexus-data

pvc:
  storageClassName: ""
  accessModes: ReadWriteOnce # Set to ReadWriteMany if using EFS/NFS for shared log storage
  storage: 2Gi
  volumeClaimTemplate:
    enabled: false
  existingClaim: null

service: # Nexus Repo NodePort Service
  annotations: {}
  nexus:
    enabled: false
    type: NodePort
    protocol: TCP
    port: 80
    targetPort: 8081
  headless:
    annotations: {}
    publishNotReadyAddresses: true # We want all pods in the StatefulSet to have their addresses published even before they're ready.

secret:
  dbSecret:
    enabled: false # Enable to apply database-secret.yaml which allows you to specify db credentials
  db:
    user: nxrm_db_user
    userAlias: nxrm_db_user_alias
    password: nxrm_db_password
    passwordAlias: nxrm_db_password_alias
    host: nxrm_db_host
    hostAlias: nxrm_db_host_alias
  # -- Use an existing secret for the database variables: DB_NAME, DB_HOST, DB_USER, DB_PASSWORD
  existingDbSecret:
    # -- Enabled the use of an already created secret, you need to uncomment the values from additionalEnv
    enabled: false
  nexusAdmin:
    name: "nexusAdminPassword"
    alias: "admin-nxrm-password-alias"
  nexusAdminSecret:
    enabled: false # Enable to apply nexus-admin-secret.yaml which allows you to the initial admin password for nexus repository
    adminPassword: yourinitialnexuspassword #You should change this when you login for the first time
  nexusSecret:
    enabled: false
    name: nexus-secret.json
    secretKeyfile: "secretfileName" # Specify the nexus secrets file name with --set-file secret.nexusSecret.secretKeyfile="file_name" helm option
    mountPath: /var/nexus-repo-secrets

nexus:
  properties:
    override: false
    data: null # specify a list of key and values to override default nexus.properties
  extraLabels: {}
  extraSelectorLabels: {}
  docker:
    enabled: false
    type: NodePort
    protocol: TCP
  # registries:
  #   - host: chart.local
  #     port: 5000
  #     secretName: registry-secret
  #     targetPort: 8081
  #     annotations: {}

# Enable configmap and add arbitrary data in configmap
config:
  enabled: false
  mountPath: /sonatype-nexus-conf
  data: null
